services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=turisticas
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - OSRM_BASE_URL=http://osrm:5000
    depends_on:
      - db
      - osrm

  osrm:
    image: osrm/osrm-backend:latest
    command:
      - osrm-routed
      - --algorithm
      - mld
      - --max-table-size
      - "200"
      - /data/rio-grande-do-norte.osrm
    volumes:
      - ./artefatos/osrm/runtime:/data:ro
    ports:
      - "127.0.0.1:5000:5000"

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: turisticas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  pgdata: